<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 Aula 08 - Sistema de Vidas</title>

    <link rel="stylesheet" href="style.css">

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.5.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.5.1/core.js">
    </script>
</head>

<body>

    <main class="container">

        <h1>🎮 Criando Inimigos</h1>

        <h2>Aula 08 - Sistema de Vidas</h2>

        <!-- Informações do jogo -->
        <section class="informacoes">

            <p>
                💰 Pontuação:
                <span id="placar">0</span>
            </p>

            <p>
                ❤️ Vidas:
                <span id="vidas">3</span>
            </p>

        </section>

        <!-- Mensagem -->
        <p id="mensagem">
            Use as setas para movimentar o jogador!
        </p>

        <!-- Área do jogo -->
        <div id="jogo">

            <!-- Jogador -->
            <div id="jogador">🥷</div>

            <!-- Moeda -->
            <div id="moeda">💰</div>

            <!-- Inimigo -->
            <div id="inimigo">🕵️‍♂️</div>

        </div>

        <!-- Instruções -->
        <p class="instrucoes">
            ⬆️ ⬇️ ⬅️ ➡️ Movimente o jogador.
            Colete moedas e desvie do detetive!
        </p>

    </main>

    <!-- Código Python -->
    <script type="py" src="jogo.py"></script>

</body>

</html>
